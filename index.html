<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styless.css">
    <title>Document</title>
</head>

<body>
    <div class="weather">
        <div class="search">
            <input type="text" placeholder="Enter your city" spellcheck="false">
            <button><img src="./images/search-icon.png" width="40px"></button>
        </div>

        <div class="weather-info">
            <img src="./images/sun.png" width="160px";>
            <h1 class="temp">22°c</h1>
            <h2 class="city">Bhopal</h2>
        </div>

        <div class="weather-details">
            <div class="col">
                <img src="./images/humidity.png" width="60px" alt="">
                  <div class="col-info">
                <p>50%</p>
                <p>humidity</p>
            </div>
            </div>
          
            <div class="col">
                <img src="./images/wind.png" width="60px" alt="">
                <div class="col-info">
                <p>50 Km/h</p>
                <p>wind</p>
            </div>
            </div>
            
        </div>
    </div>

    
</body>

</html>
